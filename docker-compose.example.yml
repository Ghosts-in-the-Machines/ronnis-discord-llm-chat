services:
  discord-llm-chat:
    build:
      context: .
      dockerfile: Dockerfile
    image: discord-llm-chat:latest
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DATA_ROOT: /app/data
      CHAT_ARCHIVE_ROOT: ${CHAT_ARCHIVE_ROOT:-/app/data/archive}
      # Set these in .env when enabled:
      # CHARACTER_CARD=/app/character_cards/card.png
      # LOREBOOK_ROOT=/app/lorebooks
      # MEMORY_PROVIDER=local:/app/memory/memories.json
      # MESSAGE_FIRST_TIMER=30  # prompt only after 30 minutes of channel silence
      # MESSAGE_FIRST_CHANNEL_IDS=123456789012345678,234567890123456789
    volumes:
      # Discord JSONL chat logs, wake files, worker state, and queued replies.
      - ${DATA_DIR:-./data}:/app/data
      # Optional external archive target. Set CHAT_ARCHIVE_ROOT=/app/chat_archive in .env to use it.
      - ${CHAT_ARCHIVE_DIR:-./chat_archive}:/app/chat_archive
      # Optional SillyTavern character card JSON or PNG files.
      - ./character_cards:/app/character_cards:ro
      # Optional lorebook JSON files.
      - ./lorebooks:/app/lorebooks:ro
      # Optional local memory files.
      - ./memory:/app/memory:ro
